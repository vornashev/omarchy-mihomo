name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # Blocking where it is checked locally; advisory for the macOS-only code.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Fetch the pinned core for the real-core tests
        # Verified against its SHA-256. With CI set, those tests fail rather
        # than skip when no core is given.
        run: |
          cargo run --locked -q -p omm-cli -- core install --dest "$RUNNER_TEMP/mihomo"
          echo "OMM_TEST_MIHOMO=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace
      - name: Build and test native app
        if: runner.os == 'macOS'
        run: |
          swift test --package-path apps/macos
          packaging/macos/build.sh
      - name: Smoke test installed macOS services
        if: runner.os == 'macOS'
        run: packaging/macos/smoke-test.sh
      - name: Archive local macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/macos/Mihomo.app target/macos/Mihomo-arm64-local.zip
      - name: Upload local macOS build
        continue-on-error: true
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mihomo-arm64-local
          path: target/macos/Mihomo-arm64-local.zip
          retention-days: 3
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true
      - name: QML tests, plugin warnings and qmllint
        run: scripts/qml-check.sh
