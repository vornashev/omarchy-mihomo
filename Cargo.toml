[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
mihomo-api = { path = "crates/mihomo-api" }
omm-proto = { path = "crates/omm-proto" }
omm-config = { path = "crates/omm-config" }
anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
idna = "1"
libc = "0.2"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "http2"] }
serde_yaml_ng = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "macros", "time", "sync", "signal", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
